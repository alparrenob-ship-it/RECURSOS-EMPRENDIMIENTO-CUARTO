div></div></section>'+
'<section class="panel"><h2>🃏 Las cinco tarjetas curiosas</h2><p class="muted">Las respuestas se guardan junto al equipo y pueden consultarse en el portafolio. Cada estudiante debe participar.</p><div class="deck">'+Array.from({length:5},(_,i)=>{const a=answers[i],done=Number.isInteger(a.answer);return '<button class="flip-button '+(flip===i?'is-flipped ':'')+(done?'complete':'')+'" data-flip="'+i+'" aria-label="Voltear tarjeta '+(i+1)+'"><span class="flip-inner"><span class="face"><img src="semana9/assets/reales/'+images[i]+'.webp" alt=""><strong>Tarjeta '+(i+1)+'</strong><small>'+(i===4?'Reto en equipo':esc(task(pr,i).label))+'</small></span><span class="face back"><span class="symbol">'+(i===4?'🤝':'❓')+'</span><strong>'+esc(task(pr,i).label)+'</strong><small>Toca para responder</small></span></span></button>'}).join('')+'</div>'+((flip>=0)?questionBlock(t,pr,flip):'<div class="notice">👆 Toca una tarjeta para descubrir la pregunta.</div>')+'<div class="actions">'+(teacher?'<button class="button" data-save="draft">💾 Guardar avance</button><button class="button green" data-save="final">✅ Finalizar y guardar en portafolio</button>':'<p class="muted">Consulta las respuestas registradas por tu docente.</p>')+'</div></section>'+ (msg?'<p class="'+(msg.includes('✓')?'notice':'warn')+'" role="status">'+esc(msg)+'</p>':'')}
function questionBlock(t,pr,i){const taskdata=task(pr,i),a=answers[i],used=answers.map((x,j)=>j!==i?x.member:'').filter(Boolean),roster=t.members||[];return '<article class="question"><span class="stage">Tarjeta '+(i+1)+' de 5</span><h3>'+esc(taskdata.question)+'</h3>'+(i<4?'<label><b>¿Qué integrante participa?</b><select id="member" '+(!teacher?'disabled':'')+'><option value="">Selecciona integrante</option>'+roster.map(m=>'<option value="'+esc(m.name)+'" '+(a.member===m.name?'selected':'')+' '+(used.includes(m.name)?'disabled':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label>':'<p><b>Participación:</b> decisión en equipo</p>')+'<div class="choices">'+taskdata.options.map((o,j)=>'<label class="choice"><input type="radio" name="respuesta" value="'+j+'" '+(a.answer===j?'checked':'')+' '+(!teacher||i<4&&!a.member?'disabled':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>'+(a.answer!==null?'<p class="'+(a.answer===taskdata.correct?'notice':'warn')+'">'+(a.answer===taskdata.correct?'✓ ¡Esta respuesta ayuda a preparar la indagación!':'Revisemos: ¿cuál opción nos permite conocer una necesidad real?')+'</p>':'')+'<p class="muted">Avance: '+answers.filter(x=>x.answer!==null).length+' de 5 tarjetas respondidas.</p></article>'}
function portfolio(){const t=get(),d=t.data.week10||{},pr=project(t),has=d.savedAt;return '<section class="panel"><span class="stage">Evidencia de aprendizaje</span><h2>📁 Portafolio · Semana 10</h2><p>Proyecto: <b>'+esc(pr[0])+'</b></p><p>Estado: <span class="pill">'+(d.status==='completed'?'Completado':has?'En proceso':'Pendiente')+'</span></p><div class="portfolio-item"><b>¿A quién investigaremos?</b><p>'+esc(d.audience||'Pendiente')+'</p></div><div class="portfolio-item"><b>¿Qué queremos descubrir?</b><p>'+esc(d.purpose||'Pendiente')+'</p></div><div class="portfolio-item"><b>Preguntas preparadas</b><ol>'+(d.questions||[]).map(x=>'<li>'+esc(x||'Pendiente')+'</li>').join('')+'</ol></div><div class="portfolio-item"><b>Respuestas de las tarjetas</b>'+Array.from({length:5},(_,i)=>{const c=d.cards?.[i]||{},qt=task(pr,i);return '<p><b>'+ (i===4?'Equipo':'Integrante '+(i+1)+': '+esc(c.member||'Pendiente'))+'</b> · '+(Number.isInteger(c.answer)?esc(qt.options[c.answer]):'Sin responder')+'</p>'}).join('')+'</div>'+(has?'<p class="muted">Último registro: '+esc(new Date(d.savedAt).toLocaleString('es-EC'))+'</p>':'')+'<button class="button" onclick="window.print()">🖨️ Imprimir evidencia</button></section>'}
function render(){if(!get())return;app.innerHTML=header()+(tab==='teoria'?theory():tab==='practica'?practice():portfolio())+'<footer class="footer">Eight Academy · Emprendimiento Innovador · Semana 10 · Cuarto A, B y C</footer>';app.querySelectorAll('button,select,textarea').forEach(x=>{if(busy)x.disabled=true})}
function selectTeam(id){const t=teams.find(x=>x.id===id);if(!t)return;chosen=id;load(t);msg='';render()}
async function save(final){if(!teacher)return;const t=get(),pr=project(t);if(!t)return;const cards=answers.map(x=>({...x}));if(final){if(!form.audience||form.purpose.trim().length<8||form.questions.some(x=>x.trim().length<8))throw Error('Completa el público objetivo, el propósito y las tres preguntas.');if(cards.some(x=>x.answer===null)||cards.slice(0,4).some(x=>!x.member))throw Error('Las cinco tarjetas deben estar respondidas y cada tarjeta individual debe tener un participante.');if(new Set(cards.slice(0,4).map(x=>x.member)).size!==4)throw Error('Las cuatro tarjetas individuales deben corresponder a cuatro integrantes diferentes.');}
busy=true;render();try{const date=new Date().toISOString(),out={audience:form.audience,purpose:form.purpose.trim(),questions:form.questions.map(x=>x.trim()),cards,status:final?'completed':'draft',savedAt:date};const payload={...t.data,week10:out};payload.activities=Array.isArray(payload.activities)?payload.activities:[];if(!payload.activities.some(x=>x.id==='week10'))payload.activities.push({id:'week10',week:10,title:'Preparar la indagación'});const r=await rpc('aula_fourth_workspace',{p_team:t.id,p_data:payload,p_expected:t.version,p_members:null});const updated=r.teams?.[0];if(!updated)throw Error('No se confirmó el guardado.');teams=teams.map(x=>x.id===updated.id?updated:x);load(updated);msg='✓ '+(final?'Consolidación guardada en el portafolio del equipo.':'Avance guardado en línea.');tab=final?'portafolio':'practica';}finally{busy=false;render()}}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.tab){tab=b.dataset.tab;msg='';flip=-1;render();}else if(b.dataset.flip!==undefined){flip=flip===+b.dataset.flip?-1:+b.dataset.flip;render()}else if(b.dataset.save){await save(b.dataset.save==='final');}}catch(err){msg=err.message;render()}});
app.addEventListener('change',e=>{const el=e.target;if(el.id==='par'){const t=teams.find(x=>x.parallel===el.value&&x.group===1)||teams.find(x=>x.parallel===el.value);if(t)selectTeam(t.id)}else if(el.id==='grp')selectTeam(el.value);else if(el.id==='member'&&teacher){answers[flip].member=el.value;answers[flip].answer=null;render()}else if(el.name==='respuesta'&&teacher){answers[flip].answer=+el.value;render()}else if(el.dataset.field&&teacher){form[el.dataset.field]=el.value}});
app.addEventListener('input',e=>{if(!teacher)return;const el=e.target;if(el.dataset.question!==undefined)form.questions[+el.dataset.question]=el.value;else if(el.dataset.field)form[el.dataset.field]=el.value;});
init();
})();
</script></body></html>
