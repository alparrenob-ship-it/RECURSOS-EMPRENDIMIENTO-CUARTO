function scoreField(k,label,max,value,member=''){return '<label>'+esc(label)+'<select data-rubric="'+esc(k)+'" data-rubric-member="'+esc(member)+'"><option value="">Sin evaluar</option>'+Array.from({length:max*2+1},(_,i)=>i/2).map(n=>'<option value="'+n+'" '+(value===n?'selected':'')+'>'+n+'</option>').join('')+'</select><span>/ '+max+'</span></label>'}
function rubricView(t){const members=t.members||[];return '<details class="c4-rubric" open><summary>Rúbrica docente · 6 grupales + 4 individuales = 10 puntos</summary><h2>Actividad y trabajo en equipo · 6 puntos grupales</h2><div class="c4-group-scores">'+rubCriteria.map(([k,label,max,desc])=>'<div>'+scoreField(k,label,max,rubric.scores[k])+'<p>'+desc+'</p></div>').join('')+'</div><h2>Orden, organización y aporte · 4 puntos por integrante</h2><div class="c4-table-wrap"><table><thead><tr><th>Integrante</th>'+rubIndividual.map(([k,label,max,desc])=>'<th>'+label+' / '+max+'<small>'+desc+'</small></th>').join('')+'<th>Total / 10</th></tr></thead><tbody>'+members.map(m=>{const scores=rubric.individual[m.name]||{},values=[...rubCriteria.map(([k,,max])=>rubric.scores[k]),...rubIndividual.map(([k])=>scores[k])],total=values.every(x=>Number.isFinite(x))?values.reduce((a,b)=>a+b,0)+' / 10':'Pendiente';return '<tr><th>'+esc(m.name)+'</th>'+rubIndividual.map(([k,label,max])=>'<td>'+scoreField(k,label,max,scores[k],m.name)+'</td>').join('')+'<td><b>'+total+'</b></td></tr>'}).join('')+'</tbody></table></div><p>Las respuestas no generan una nota automática; la docente asigna los puntos según la evidencia.</p></details>'}
function practice(){const t=get(),pr=project(t),members=t.members||[];return '<section class="c4-consolidation"><div class="c4-cards">'+Array.from({length:5},(_,i)=>{const a=answers[i],q=task(pr,i);return '<article class="c4-card"><header><span>'+(i+1)+'</span><h2>'+esc(q.label)+'</h2></header>'+(i<4?'<label>¿A quién le toca?<select data-card-member="'+i+'"><option value="">Selecciona al integrante</option>'+members.map(m=>'<option value="'+esc(m.name)+'" '+(a.member===m.name?'selected':'')+' '+(answers.some((x,j)=>j!==i&&x.member===m.name)?'disabled':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label>':'<label>¿A quién le toca?<select disabled><option>Todo el equipo</option></select></label>')+'<h3>'+esc(q.question)+'</h3><div class="c4-options">'+q.options.map((opt,j)=>'<label><input type="radio" name="c4-answer-'+i+'" data-card-answer="'+i+'" value="'+j+'" '+(a.answer===j?'checked':'')+' '+(i<4&&!a.member?'disabled':'')+'>'+esc(opt)+'</label>').join('')+'</div>'+(a.answer!==null?'<p class="c4-feedback">'+(a.answer===q.correct?'✓ Elección adecuada. ¡Bien hecho!':'Revisemos juntos. ¿Cuál respuesta ayuda a comprender mejor al usuario?')+'</p>':'')+'</article>'}).join('')+'</div>'+rubricView(t)+'<div class="actions"><button class="button" data-save="draft">💾 Guardar avance</button><button class="button green" data-save="final">✅ Guardar evaluación y tarjetas</button><button class="button" data-tab="portafolio">📁 Consultar portafolio</button></div>'+(msg?'<p class="'+(msg.includes('✓')?'notice':'warn')+'" role="status">'+esc(msg)+'</p>':'')+'</section>'}
function questionBlock(t,pr,i){const taskdata=task(pr,i),a=answers[i],used=answers.map((x,j)=>j!==i?x.member:'').filter(Boolean),roster=t.members||[];return '<article class="question"><span class="stage">Tarjeta '+(i+1)+' de 5</span><h3>'+esc(taskdata.question)+'</h3>'+(i<4?'<label><b>¿Qué integrante participa?</b><select id="member" '+(!teacher?'disabled':'')+'><option value="">Selecciona integrante</option>'+roster.map(m=>'<option value="'+esc(m.name)+'" '+(a.member===m.name?'selected':'')+' '+(used.includes(m.name)?'disabled':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label>':'<p><b>Participación:</b> decisión en equipo</p>')+'<div class="choices">'+taskdata.options.map((o,j)=>'<label class="choice"><input type="radio" name="respuesta" value="'+j+'" '+(a.answer===j?'checked':'')+' '+(!teacher||i<4&&!a.member?'disabled':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>'+(a.answer!==null?'<p class="'+(a.answer===taskdata.correct?'notice':'warn')+'">'+(a.answer===taskdata.correct?'✓ ¡Esta respuesta ayuda a preparar la indagación!':'Revisemos: ¿cuál opción nos permite conocer una necesidad real?')+'</p>':'')+'<p class="muted">Avance: '+answers.filter(x=>x.answer!==null).length+' de 5 tarjetas respondidas.</p></article>'}
function portfolio(){const t=get(),d=t.data.week10||{},pr=project(t),r=d.rubric||{};return '<section class="panel"><span class="stage">EVIDENCIA · SEMANA 10</span><h2>📁 Cinco tarjetas curiosas</h2><p><b>Proyecto:</b> '+esc(pr[0])+'</p><p><b>Estado:</b> '+(d.status==='completed'?'Completado':d.savedAt?'En proceso':'Pendiente')+'</p>'+Array.from({length:5},(_,i)=>{const c=d.cards?.[i]||{},q=task(pr,i);return '<div class="portfolio-item"><b>Tarjeta '+(i+1)+' · '+(i===4?'Respuesta grupal':esc(c.member||'Integrante pendiente'))+'</b><p>'+esc(q.question)+'</p><p>'+(Number.isInteger(c.answer)?esc(q.options[c.answer]):'Sin responder')+'</p></div>'}).join('')+'<h3>Rúbrica docente</h3><p>Actividad: '+esc(r.scores?.activity??'Pendiente')+' / 4 · Trabajo en equipo: '+esc(r.scores?.teamwork??'Pendiente')+' / 2</p>'+Object.entries(r.individual||{}).map(([n,v])=>'<p><b>'+esc(n)+':</b> Orden '+esc(v.order??'–')+' · Organización '+esc(v.organization??'–')+' · Aporte '+esc(v.contribution??'–')+'</p>').join('')+'<div class="actions"><button class="button" data-tab="practica">← Volver a la actividad</button><button class="button" onclick="window.print()">🖨️ Imprimir</button></div></section>'}
function render(){if(!get())return;app.innerHTML=header()+(tab==='portafolio'?portfolio():practice())+'<footer class="footer">Eight Academy · Emprendimiento Innovador · Semana 10 · Cuarto A, B y C</footer>';app.querySelectorAll('button,select,textarea').forEach(x=>{if(busy)x.disabled=true})}
function selectTeam(id){const t=teams.find(x=>x.id===id);if(!t)return;chosen=id;load(t);msg='';render()}
async function save(final){if(!teacher)return;const t=get(),pr=project(t);if(!t)return;const cards=answers.map(x=>({...x}));if(final){if(cards.some(x=>x.answer===null)||cards.slice(0,4).some(x=>!x.member))throw Error('Las cinco tarjetas deben estar respondidas y cada tarjeta individual debe tener un participante.');if(new Set(cards.slice(0,4).map(x=>x.member)).size!==4)throw Error('Las cuatro tarjetas individuales deben corresponder a cuatro integrantes diferentes.');}
busy=true;render();try{const date=new Date().toISOString(),out={...(t.data.week10||{}),cards,rubric,status:final?'completed':'draft',savedAt:date};const payload={...t.data,week10:out};payload.activities=Array.isArray(payload.activities)?payload.activities:[];if(!payload.activities.some(x=>x.id==='week10'))payload.activities.push({id:'week10',week:10,title:'Preparar la indagación'});const r=await rpc('aula_fourth_workspace',{p_team:t.id,p_data:payload,p_expected:t.version,p_members:null});const updated=r.teams?.[0];if(!updated)throw Error('No se confirmó el guardado.');teams=teams.map(x=>x.id===updated.id?updated:x);load(updated);msg='✓ '+(final?'Consolidación guardada en el portafolio del equipo.':'Avance guardado en línea.');tab=final?'portafolio':'practica';}finally{busy=false;render()}}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.tab){tab=b.dataset.tab;msg='';flip=-1;render();}else if(b.dataset.flip!==undefined){flip=flip===+b.dataset.flip?-1:+b.dataset.flip;render()}else if(b.dataset.save){await save(b.dataset.save==='final');}}catch(err){msg=err.message;render()}});
app.addEventListener('change',e=>{const el=e.target;if(el.id==='par'){const t=teams.find(x=>x.parallel===el.value&&x.group===1)||teams.find(x=>x.parallel===el.value);if(t)selectTeam(t.id)}else if(el.id==='grp'){selectTeam(el.value)}else if(el.dataset.cardMember!==undefined){const i=+el.dataset.cardMember;answers[i]={member:el.value,answer:null};render()}else if(el.dataset.cardAnswer!==undefined){answers[+el.dataset.cardAnswer].answer=+el.value;render()}else if(el.dataset.rubric!==undefined){const key=el.dataset.rubric,member=el.dataset.rubricMember,value=el.value===''?null:+el.value;if(member){rubric.individual[member]||={};rubric.individual[member][key]=value}else rubric.scores[key]=value;render()}});
app.addEventListener('input',e=>{if(!teacher)return;const el=e.target;if(el.dataset.question!==undefined)form.questions[+el.dataset.question]=el.value;else if(el.dataset.field)form[el.dataset.field]=el.value;});
init();
})();
</script></body></html>
