<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semana 10 · Cuarto · Cinco tarjetas curiosas</title><link rel="stylesheet" href="semana9/cuarto.css?v=4"><link rel="stylesheet" href="semana9/cuarto-consolidacion.css?v=1"><style>body{background:#fcfaf4}.lesson-top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:19px 28px;background:white;border-bottom:1px solid #dedfd7}.lesson-top a{color:#17394a;font-weight:750}.c4-consolidation{max-width:1440px;margin:24px auto;padding:0 20px}.practical-heading{display:flex;justify-content:space-between;align-items:center;gap:15px}.practical-heading h1{font-size:clamp(26px,3vw,43px)}.practical-heading select{padding:9px;border-radius:10px;margin-left:10px}.project-banner{background:#e9f5ed;padding:16px;border-radius:12px}.c4-consolidation .c4-cards{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:980px){.c4-consolidation .c4-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.c4-consolidation .c4-cards{grid-template-columns:1fr}.practical-heading{display:block}}.c4-status{text-align:center;padding:20px}</style></head><body><header class="lesson-top"><a href="index.html?planCurso=4">← Semanas</a><strong>EIGHT ACADEMY · CUARTO · SEMANA 10</strong><span>Actividad y rúbrica</span></header><div id="lesson"></div><script src="semana8-datos.js?v=4"></script><script src="semana10-cuarto-tarjetas.js?v=1"></script><script>
(()=>{'use strict';const root=document.getElementById('lesson'),q=new URLSearchParams(location.search);let parallel=['A','B','C'].includes(q.get('paralelo'))?q.get('paralelo'):'A',group=Number(q.get('grupo'))||1,notice='';
const team=()=>window.weekEightProjects.find(p=>p.parallel===parallel&&p.group===group);
function render(){root.innerHTML='<div class="c4-status"><label>Paralelo <select id="parallel">'+['A','B','C'].map(p=>'<option '+(p===parallel?'selected':'')+'>'+p+'</option>').join('')+'</select></label> &nbsp; Actividad de equipo · Sin conexión a Supabase</div>'+window.CuartoConsolidation10.view(parallel,group,team())+(notice?'<p class="c4-status" role="status">'+notice+'</p>':'');}
root.addEventListener('change',e=>{if(e.target.id==='parallel'){parallel=e.target.value;group=1;notice='';render();return;}if(e.target.id==='group'){group=+e.target.value;notice='';render();return;}if(window.CuartoConsolidation10.change(e.target)){notice='Respuesta registrada en este dispositivo.';render();}});
root.addEventListener('click',e=>{if(e.target.closest('[data-c4-save]')){window.CuartoConsolidation10.save();notice='Rúbrica guardada en este dispositivo.';render();}});
render();
})();
</script></body></html>
