){return '<button class="swatch '+(selectedColors.includes(c)?'selected':'')+'" title="'+c+'" aria-label="Elegir color '+c+'" aria-pressed="'+selectedColors.includes(c)+'" style="background:'+c+'" data-color="'+c+'">'+(selectedColors.includes(c)?'✓':'')+'</button>'}).join('')+'</div><button class="button primary" data-save>💾 Guardar mi propuesta</button><p class="muted">Puedes guardar primero tu boceto y completar el logotipo digital después.</p></div>':'<p class="muted">'+(teacher?'Vista docente: las propuestas son editadas por sus propios autores.':'Ingresa a tu aula con tu nombre para editar tu plantilla.')+'</p>')+'</section>'}
function choicesFor(cat){var arr=(snapshot.proposals||[]).filter(function(p){return cat==='logo'?!!p.logo:cat==='name'?!!p.name:cat==='slogan'?!!p.slogan:(p.colors||[]).length>0});return arr.map(function(p){var m=memberName(p.member),label=cat==='logo'?'Logotipo de '+m:cat==='name'?p.name:cat==='slogan'?p.slogan:'Colores de '+m;return '<button class="vote-option" data-vote="'+cat+'" data-candidate="'+E(p.member)+'" '+(teacher||!self()||ballot(cat)?'disabled':'')+'>'+(cat==='logo'?'<img src="'+img(p.logo)+'" alt="">':'<span style="font-size:22px">✨</span>')+'<span><strong>'+E(label)+'</strong><small>'+E(m)+(ballot(cat)?.candidate===p.member?' · TU VOTO ✓':'')+'</small>'+(cat==='colors'?'<span class="colors">'+(p.colors||[]).map(function(c){return '<span class="swatch" style="background:'+E(c)+';width:20px;height:20px"></span>'}).join('')+'</span>':'')+'</span></button>'}).join('')||'<p class="muted">Aún no hay propuestas listas.</p>'}
function votes(){var n=members().length;return '<section class="panel"><h2>🗳️ Votación democrática</h2><p>Cada estudiante puede emitir <b>un solo voto en cada categoría</b>. Los votos se registran de forma individual. La marca final puede combinar propuestas de diferentes integrantes.</p><div class="votes">'+categories.map(function(c){var voted=(snapshot.votes||[]).filter(function(v){return v.category===c[0]}).length;return '<article class="vote-card"><h3>'+E(c[1])+'</h3><p class="muted">'+voted+' de '+n+' votos registrados</p>'+choicesFor(c[0])+(ballot(c[0])?'<span class="badge">✓ Voto ya registrado</span>':'')+'</article>'}).join('')+'</div><p class="muted">Los resultados se confirman cuando todos los integrantes han votado en las cuatro categorías.</p></section>'+resultBlock()}
function resultBlock(){return '<section class="panel"><h2>🏆 Resultado final del equipo</h2>'+(full()?'<p class="notice">Todos los votos están registrados.</p>':'<p class="error">Esperando los votos de todos los integrantes para definir la identidad ganadora.</p>')+'<div class="fields">'+categories.map(function(c){var w=top(c[0]),id=winner(c[0]);return '<div><strong>'+E(c[1])+'</strong><p>'+E(id?memberName(id):full()&&w.ids.length>1?'Empate entre '+w.ids.length+' propuestas':'Pendiente')+'</p>'+(teacher&&full()&&w.ids.length>1?'<label>Resolver empate<select data-override="'+c[0]+'"><option value="">Elegir entre las empatadas</option>'+w.ids.map(function(a){return '<option value="'+E(a)+'" '+(overrides[c[0]]===a?'selected':'')+'>'+E(memberName(a))+'</option>'}).join('')+'</select></label>':'')+'</div>'}).join('')+'</div>'+(teacher?'<button class="button primary" data-class-save>Guardar decisión de desempate</button>':'')+'</section>'}
function portfolio(){return '<section class="panel"><h2>📁 Portafolio digital · Semana 10</h2><p>Las siguientes dos diapositivas se generan con las propuestas digitales y las opciones ganadoras. Para la primera se conservan todos los logotipos mejorados; para la segunda se muestran los elementos más votados.</p><button class="button dark" onclick="window.print()">🖨️ Imprimir ambas diapositivas en A4 horizontal</button></section>'+slides()}
function slides(){var arr=members().map(function(m){return {member:m,p:proposal(m.id)}});var picked={};categories.forEach(function(c){picked[c[0]]=winner(c[0])?proposal(winner(c[0])):null});var title=picked.name?.name||'Nombre de marca por elegir';var sloganWinning=picked.slogan?.slogan||'Eslogan pendiente de votación';return '<section class="preview" aria-label="Diapositiva 1 propuestas de logotipos"><h2>IDENTIDAD DE MARCA · PROPUESTAS DEL EQUIPO</h2><div class="logos">'+arr.map(function(x){return '<div>'+(img(x.p.logo)?'<img src="'+img(x.p.logo)+'" alt="Logotipo de '+E(x.member.name)+'">':'<div style="font-size:55px">◯</div>')+'<strong>'+E(x.p.name||'Nombre pendiente')+'</strong><em>“'+E(x.p.slogan||'Eslogan pendiente')+'”</em><small>'+E(x.member.name)+'</small></div>'}).join('')+'</div></section><section class="preview" aria-label="Diapositiva 2 identidad ganadora"><h2>'+E(title.toUpperCase())+'</h2><div class="final-grid"><div><div class="winner-label">NUESTROS COLORES</div><div class="winner-colors">'+(picked.colors?.colors||[]).map(function(c){return '<span style="background:'+E(c)+'"></span>'}).join('')+'</div><p class="muted">Paleta más votada</p></div><div><div class="winner-label">NUESTRO LOGOTIPO</div>'+(img(picked.logo?.logo)?'<img class="winner-logo" src="'+img(picked.logo.logo)+'" alt="Logotipo ganador">':'<div style="font-size:70px">◯</div>')+'<h3>'+E(title)+'</h3></div></div><div class="slogan">“'+E(sloganWinning)+'”</div></section>'}
function render(){if(!snapshot)return;root.innerHTML=hero()+(message?'<p role="status" class="'+(error?'error':'notice')+'">'+E(message)+'</p>':'')+(section==='crear'?individual():section==='teoria'?theory():section==='practica'?practice():section==='votar'?votes():portfolio())+'<footer class="footer">Eight Academy · 5.º A, B y C · Emprendimiento Innovador · Semana 10</footer>';if(loading)root.querySelectorAll('button,input,textarea,select').forEach(function(x){x.disabled=true})}
async function refresh(tid){var d=await rpc('aula_brand10_snapshot',teacher?{p_team:tid}:{});load(d);render()}
async function init(){try{var conf=window.AulaSupabaseConfig;if(!window.supabase?.createClient||!conf?.url)throw Error('No se cargó la conexión a Supabase.');client=window.supabase.createClient(conf.url,conf.publishableKey,{auth:{storageKey:teacher?'ea-aula-supabase-session-v1':'ea-aula-student-auth-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});var a=await client.auth.getSession();if(!a.data.session)throw Error('Ingresa primero a tu aula '+(teacher?'docente':'del estudiante')+'.');if(teacher){var list=await rpc('aula_brand10_snapshot');teams=list.teams||[];var choice=teams.find(function(x){return x.parallel===q.get('paralelo')&&x.group===+q.get('grupo')})||teams[0];if(!choice)throw Error('No hay equipos disponibles para quinto.');await refresh(choice.id)}else await refresh();}catch(ex){root.innerHTML='<section class="panel"><h2>Acceso a la actividad</h2><p class="error">'+E(ex.message)+'</p><a class="button primary" href="'+(teacher?'aula-docente.html':'aula-estudiante.html?grado=5')+'">Ingresar al aula →</a></section>'}}
async function saveClass(){var t=team();if(!teacher)return;ticket.overrides=overrides;await rpc('aula_brand10_class_save',{p_team:t.id,p_board:board,p_ticket:ticket});await refresh(t.id);message='✓ Pizarra y tickets guardados.';render()}
async function saveProposal(){if(!self())throw Error('Ingresa como estudiante.');var v={name:name.trim(),slogan:slogan.trim(),colors:selectedColors,sketch:sketch,logo:logo};await rpc('aula_brand10_save',{p_proposal:v});await refresh();message='✓ Tu propuesta quedó guardada y compartida con tu equipo.';render()}
function compress(file){return new Promise(function(ok,fail){if(!file.type.startsWith('image/'))return fail(Error('Selecciona una fotografía o imagen.'));if(file.size>12000000)return fail(Error('La imagen supera el límite de 12 MB.'));var reader=new FileReader();reader.onerror=function(){fail(Error('No se pudo leer la imagen'))};reader.onload=function(){var pic=new Image();pic.onload=function(){var max=520,sc=Math.min(1,max/Math.max(pic.width,pic.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(pic.width*sc));cv.height=Math.max(1,Math.round(pic.height*sc));var ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(pic,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.68))};pic.onerror=function(){fail(Error('No se pudo convertir la imagen'))};pic.src=reader.result};reader.readAsDataURL(file)})}
root.addEventListener('click',async function(e){var b=e.target.closest('button');if(!b||b.disabled)return;var tab=b.dataset.tab;if(tab){if(!teacher&&['teoria','practica'].includes(tab))return;section=tab;message='';render();return}if(b.dataset.color){var c=b.dataset.color;selectedColors=selectedColors.includes(c)?selectedColors.filter(function(x){return x!==c}):selectedColors.length<3?selectedColors.concat(c):selectedColors;render();return}if(b.dataset.vote){if(!confirm('¿Confirmas tu único voto para '+categories.find(function(c){return c[0]===b.dataset.vote})[1]+'? No podrás cambiarlo.'))return}
try{loading=true;message='';if(b.hasAttribute('data-class-save'))await saveClass();else if(b.hasAttribute('data-save'))await saveProposal();else if(b.hasAttribute('data-ticket-save')){if(!ticketMember||ticketChoice==='')throw Error('Selecciona estudiante y respuesta.');var qi=ticketQuestion,correct=ticketQuestions[qi][2];ticket[ticketMember]={question:qi,answer:+ticketChoice,correct:+ticketChoice===correct};ticketMember='';ticketChoice='';await saveClass()}else if(b.dataset.vote){await rpc('aula_brand10_vote',{p_category:b.dataset.vote,p_candidate:b.dataset.candidate});await refresh();message='✓ Tu voto quedó registrado. Solo puedes votar una vez por categoría.'}error=false;
}catch(ex){message=ex.message;error=true}finally{loading=false;render()}});
root.addEventListener('input',function(e){var x=e.target;if(x.id==='brand-name')name=x.value;else if(x.id==='brand-slogan')slogan=x.value;else if(x.dataset.board)board[x.dataset.board]=x.value});
root.addEventListener('change',async function(e){var x=e.target;if(x.id==='team-select'){try{await refresh(x.value);message=''}catch(ex){message=ex.message;error=true;render()}}else if(x.id==='ticket-member'){ticketMember=x.value;ticketChoice='';render()}else if(x.id==='ticket-question'){ticketQuestion=+x.value;ticketChoice='';render()}else if(x.name==='ticket-choice')ticketChoice=x.value;else if(x.dataset.override){overrides[x.dataset.override]=x.value;render()}else if(x.dataset.upload){var f=x.files?.[0];if(!f)return;try{var data=await compress(f);if(x.dataset.upload==='sketch')sketch=data;else logo=data;message='Imagen preparada. Recuerda guardar tu propuesta.';error=false;render()}catch(ex){message=ex.message;error=true;render()}}});
init();
})();
</script></body></html>
