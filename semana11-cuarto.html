function shuffled(item,i){const sh=(i+S.group+(S.parallel.charCodeAt(0)-65))%3;return item.opts.map((text,j)=>({text,correct:j===item.correct})).map((_,j,a)=>a[(j+sh)%3]);}
function render(){document.querySelectorAll('#parallel option').forEach(o=>o.selected=o.value===S.parallel);$('s1').classList.toggle('active',S.session===1);$('s2').classList.toggle('active',S.session===2);$('phases').innerHTML=(S.session===1?names:['🔎 Laboratorio','👤 Detectives','🗂 Ficha grupal','🏅 Rúbrica']).map((n,i)=>'<button class="phase '+(S.phase===i?'active':'')+'" data-act="phase" data-n="'+i+'">'+n+'</button>').join('');$('stage').innerHTML=S.session===1?[activation,anticipation,construction,consolidation][S.phase]():[lab,detectives,worksheetPage,rubricPage][S.phase]();$('prev').disabled=S.phase===0;$('next').textContent=S.phase===3?'✓ Sesión completa':'Siguiente →';}
function activation(){const steps=[['🔎','Detectives de detalles','Mira con atención una escena de la escuela.'],['👀','¿Qué apareció?','Nombra, señala o dibuja un detalle.'],['📝','Guardamos la pista','Representa lo que viste con una palabra, marca o dibujo.']];const s=steps[S.step];return '<div class="stage-head"><h2>Juego: Detectives de detalles</h2><span class="mini">5 minutos · Activación DUA</span></div><p class="subtitle">Puedes participar hablando, señalando, dibujando o desde tu puesto. No hay eliminaciones.</p><div class="game-spot"><span class="game-symbol">'+s[0]+'</span><div><div class="big">'+s[1]+'</div><p>'+s[2]+'</p></div></div><div class="micro-options">'+steps.map((v,i)=>'<button class="'+(i===S.step?'selected':'')+'" data-act="step" data-n="'+i+'">Paso '+(i+1)+'<br>'+v[1]+'</button>').join('')+'</div>';}
function anticipation(){const r=[['Observo','¿Qué veo en la imagen?'],['Pienso','¿Qué están haciendo los niños?'],['Identifico','¿Qué acciones realizan?']];return '<div class="stage-head"><h2>Observo · Pienso · Identifico</h2><span class="mini">5 minutos · Anticipación</span></div><div class="visual"><div class="illustration"><img src="semana11-escena.svg" alt="Ilustración de niños observando una tienda y anotando datos" style="width:100%;max-height:340px;object-fit:contain"><p>Observamos a niños investigando una situación escolar</p><span class="tiny">Mira detalles, acciones y materiales. ¿Qué descubrimos?</span></div><div class="routines">'+r.map((v,i)=>'<button class="rbtn '+(i===S.routine?'selected':'')+'" data-act="routine" data-n="'+i+'"><strong>'+['👁 ','💭 ','💡 '][i]+v[0]+'</strong><small>'+v[1]+'</small></button>').join('')+'<label for="board"><b>Ideas del curso · '+r[S.routine][0]+'</b></label><textarea class="board" id="board" placeholder="Anota aquí las ideas de los estudiantes…">'+esc((read('ea-w11-ideas-'+S.parallel)||{})[S.routine]||'')+'</textarea></div></div><p class="tiny">Las ideas del curso se guardan en este dispositivo y sirven para explicar el tema.</p>';}
function construction(){return '<div class="stage-head"><h2>Observar y registrar</h2><span class="mini">10 minutos · Construcción</span></div><p class="subtitle">Conectamos las ideas de la anticipación con dos conceptos nuevos.</p><div class="concept-grid"><article class="concept"><span class="emoji" aria-hidden="true">👁️🔎</span><h3>OBSERVAR</h3><p>Mirar con atención lo que sucede para descubrir las necesidades de nuestros clientes.</p><p class="em">Ejemplo: veo estudiantes esperando su turno.</p></article><article class="concept"><span class="emoji" aria-hidden="true">📝📋</span><h3>REGISTRAR</h3><p>Anotar, dibujar o contar la información que descubrimos durante la observación.</p><p class="em">Ejemplo: anoto cuántos estudiantes esperan.</p></article></div><div class="conclusion">💡 Observamos y registramos para conocer las necesidades de nuestros clientes y crear soluciones útiles.</div>';}

const sceneRounds=[
{title:'La tienda escolar',art:'🏪 🥪 👧',context:'¿Cómo descubrimos lo que ocurre cuando los estudiantes retiran pedidos?',story:['Mirar la fila de la tienda','Notar a quiénes esperan','Contar a quienes esperan','Anotar el número observado']},
{title:'Los útiles escolares',art:'🎒 ✏️ 📚',context:'¿Cómo investigamos los útiles que se extravían en clase?',story:['Mirar los útiles del aula','Identificar útiles sin nombre','Contar útiles sin etiqueta','Dibujar o escribir el conteo']},
{title:'El recreo',art:'🏫 🧒 ⚽',context:'¿Cómo descubrimos lo que sucede en los juegos del recreo?',story:['Mirar el espacio de juegos','Notar quiénes esperan turno','Contar estudiantes esperando','Registrar el dato en una tabla']},
{title:'Las plantas del colegio',art:'🌱 🪴 🌼',context:'¿Cómo investigamos qué sucede con las plantas del patio?',story:['Mirar las plantas sin tocarlas','Identificar hojas secas visibles','Contar las hojas secas','Dibujar lo que se observó']},
{title:'Los bebederos de agua',art:'💧 🚰 🥤',context:'¿Cómo averiguamos qué ocurre cerca del punto de agua?',story:['Mirar el punto de agua','Notar estudiantes utilizando agua','Contar cuántos lo utilizan','Hacer marcas de conteo']}
];
const stepArt=['👀','🔎','🧮','📝'],stepLabels=['MIRAR','IDENTIFICAR','CONTAR','REGISTRAR'],stepColors=['#f6a1c6','#64bcea','#e8bd45','#87d08c'],stepFills=['#fff0f7','#e9f8ff','#fff8df','#edffed'];
function gameOrderState(){const v=record.orderGame||{};v.answers=Array.isArray(v.answers)?v.answers.filter((x,i)=>i<20&&x>=0&&x<=3):[];return v}
function orderRound(){return Math.min(4,Math.floor(gameOrderState().answers.length/4))}
function orderProgress(){return Math.min(20,gameOrderState().answers.length)}
function roundChoices(r){const turns=[0,1,2,3];const shift=(r+S.parallel.charCodeAt(0))%4;return turns.map((_,i)=>turns[(i+shift)%4])}
function gameRubricList(){const entries=record.orderPupils||{};let rows='';for(let n=0;n<20;n++){const row=entries[n]||{},done=n<orderProgress();rows+='<tr><td><b>'+(n+1)+'</b></td><td><input aria-label="Nombre del estudiante '+(n+1)+'" data-order-name="'+n+'" type="text" maxlength="70" placeholder="Estudiante '+(n+1)+'" value="'+esc(row.name||'')+'"></td><td>'+(done?'✅ Realizó el paso '+((n%4)+1):'○ Pendiente')+'</td><td><input aria-label="Actividad, estudiante '+(n+1)+'" data-order-activity="'+n+'" type="number" min="0" max="7" step="1" placeholder="0–7" value="'+(row.activity??'')+'" style="max-width:75px"></td><td><input aria-label="Códigos, estudiante '+(n+1)+'" data-order-codes="'+n+'" type="number" min="0" max="3" step="1" placeholder="0–3" value="'+(row.codes??'')+'" style="max-width:75px"></td><td><b>'+(Number.isInteger(row.activity)&&Number.isInteger(row.codes)?(row.activity+row.codes)+'/10':'—')+'</b></td></tr>';}return '<details class="order-list"><summary>📋 Lista docente · 20 estudiantes · Evaluación individual</summary><div style="overflow-x:auto"><table class="order-table"><thead><tr><th>N.º</th><th>Nombre</th><th>Turno</th><th>Actividad /7</th><th>Códigos /3</th><th>Total</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="tiny" style="padding:12px">Puedes ingresar un nombre y puntajes por estudiante. Todos se conservan solo en este navegador. No se asignan notas automáticamente por respuesta correcta.</p></details>';}
function consolidation(){const st=gameOrderState(),progress=orderProgress(),r=orderRound(),step=progress%4,scene=sceneRounds[r],wrong=st.wrong===progress;const signs=stepLabels.map((label,i)=>'<div class="order-sign" style="--line:'+stepColors[i]+'"><span aria-hidden="true">'+stepArt[i]+'</span><b>'+label+'</b></div>').join('');const filled=stepLabels.map((label,i)=>{const done=i<step||progress===20;return '<div class="'+(done?'done':'')+'"><strong>'+(i+1)+'. '+label+'</strong><span class="small-art">'+(done?stepArt[i]:'❔')+'</span><span class="smalltext">'+(done?scene.story[i]:'Esperamos al detective')+'</span></div>'}).join('');const options=roundChoices(r).map(i=>'<button type="button" class="order-poster '+(i<step?'used':'')+'" style="--edge:'+stepColors[i]+';--fill:'+stepFills[i]+'" data-act="order-choose" data-n="'+i+'" '+(i<step?'disabled':'')+'><span class="art">'+stepArt[i]+'</span><span class="caption">'+esc(scene.story[i])+'</span></button>').join('');
return '<div class="order-game"><div class="stage-head"><h2>🎯 Ordena las pistas</h2><span class="mini">Consolidación · 10 minutos</span></div><div class="order-banner"><div class="medal" aria-hidden="true">🕵️‍♀️</div><div><strong>¡20 detectives, 20 turnos!</strong><p>Ordenamos las acciones para investigar sin inventar datos. Cada niño coloca <b>un cartel</b> en el paso correcto: mirando, identificando, contando o registrando.</p></div></div><div class="order-signs">'+signs+'</div><div class="order-counter"><b>'+Math.min(progress+1,20)+' de 20 estudiantes</b><span class="mini">Ronda '+(r+1)+' de 5 · 4 turnos</span></div><div class="order-bars">'+Array.from({length:20},(_,i)=>'<button title="Estudiante '+(i+1)+'" type="button" data-act="order-jump" data-n="'+i+'" class="'+(i<progress?'done':i===progress?'current':'')+'" '+(i>progress?'disabled':'')+'>'+(i+1)+'</button>').join('')+'</div><div class="order-scene"><span class="scene-art" aria-hidden="true">'+scene.art+'</span><div><p class="eyebrow">ESCENA '+(r+1)+'</p><h3>'+scene.title+'</h3><p>'+scene.context+'</p></div></div>'+
(progress===20?'<div class="order-notice order-pulse" role="status">🏆 ¡Misión cumplida! Los 20 estudiantes tuvieron un turno. Recuerden: primero observamos hechos y después registramos los datos.</div>':'<div class="order-step"><h3>🧩 Turno '+(progress+1)+' · ¿Qué cartel va ahora?</h3><p>Elige el cartel que sigue para completar la investigación. Puedes tocarlo, señalarlo o decirlo para que la docente lo seleccione.</p></div>')+
'<div class="order-filled">'+filled+'</div>'+(progress<20?'<div class="order-choices">'+options+'</div>':'')+
'<div class="order-notice '+(wrong?'warn':'')+'" role="status">'+(wrong?'💭 Todavía no. Mira qué paso falta y vuelve a intentarlo; no pierdes tu turno.':st.last===progress-1&&progress>0?'✨ ¡Correcto! La pista quedó en orden. Sigue el próximo estudiante.':'👂 Un estudiante por turno. Los demás pueden ayudar mostrando un gesto o cartel desde su lugar.')+'</div>'+
'<div class="order-more"><button class="btn" data-act="order-undo" data-n="0" '+(progress===0?'disabled':'')+'>↶ Repetir último turno</button><button class="btn" data-act="order-reset" data-n="0">⟳ Reiniciar juego</button></div><div class="order-rubric-guide">🏅 Rúbrica individual sin cambios: <b>Actividad 7 puntos</b> + <b>Cumplimiento de códigos 3 puntos</b> = <b>10 puntos</b>. La docente evalúa cada participación, respetando las formas de respuesta del DUA.</div>'+gameRubricList()+rubricHTML(true)+'</div>';}
function rolesHTML(){return '<div class="role-grid">'+roles.map((r,i)=>'<article class="role-card '+(i===S.role?'current':'')+'" '+theme(i)+'><span class="symbol" aria-hidden="true">'+r.icon+'</span><b>'+(i+1)+'. '+r.name+'</b><small>'+r.q+'</small></article>').join('')+'</div>';}
function lab(){const c=cases();return '<div class="stage-head"><h2>🔎 Laboratorio de evidencias</h2><span class="mini">Sesión 2 · Actividad grupal</span></div><p class="subtitle"><b>Observar y registrar para comprender a nuestro usuario.</b> Cuatro misiones, cuatro turnos, una ficha por equipo.</p><div class="groups"><label>Grupo <select id="group">'+[1,2,3,4,5].map(i=>'<option '+(i===S.group?'selected':'')+'>'+i+'</option>').join('')+'</select></label>'+btn('🖨 Imprimir ficha','print',0)+'</div><div class="projectbar"><strong>'+esc(c.p.icon||'💡')+' Grupo '+S.group+' · '+esc(c.p.title)+'</strong><br><span>'+esc(c.p.situation||c.detail)+'</span></div>'+rolesHTML()+'<div class="feedback">Cada integrante elige una respuesta y completa su espacio de la ficha. Si un equipo tiene cinco integrantes, el quinto comprueba que la evidencia coincida con lo observado.</div>';}
function detectives(){const c=cases(),i=S.role,q=choices()[i],arr=shuffled(q,i),sel=record.answers?.[i];return '<div class="stage-head"><h2>Misión de los cuatro detectives</h2><span class="mini">Turno '+(i+1)+' de 4</span></div><div class="projectbar"><strong>'+esc(c.p.title)+'</strong> · '+esc(c.detail)+'</div><div class="roleprogress">'+roles.map((r,j)=>'<span class="'+(j<i?'done':j===i?'now':'')+'"></span>').join('')+'</div><div class="quest" '+theme(i)+'><p class="eyebrow">'+roles[i].icon+' '+esc(q.title)+'</p><h3>'+esc(q.q)+'</h3><label><b>Nombre del integrante:</b> <input id="member" maxlength="80" placeholder="Nombre y apellido" value="'+esc(record.members?.[i]||'')+'" style="max-width:320px;border:2px solid #abc9ce;border-radius:10px;padding:10px"></label><div class="options">'+arr.map((v,j)=>'<button class="flip '+(sel===j?(v.correct?'selected':'wrong'):'')+'" data-act="answer" data-n="'+j+'"><strong>'+String.fromCharCode(65+j)+'.</strong> '+esc(v.text)+'</button>').join('')+'</div>'+(Number.isInteger(sel)?'<p class="feedback">'+(arr[sel].correct?'✅ ¡Bien observado! '+q.why:'🔍 Revisemos: elige un hecho o dato que puedas comprobar.')+'</p>':'<p class="tiny">Elige una opción. Después aparecerá una explicación.</p>')+'</div><div class="actions"><button class="btn" data-act="role" data-n="'+Math.max(0,i-1)+'" '+(i===0?'disabled':'')+'>← Detective anterior</button><button class="btn primary" data-act="role" data-n="'+Math.min(3,i+1)+'" '+(i===3?'disabled':'')+'>Siguiente detective →</button></div>';}
function worksheet(){const c=cases(),qs=choices();return '<section class="worksheet"><div class="stage-head"><h3>🔎 Laboratorio de evidencias</h3><span class="mini">Ficha grupal · Semana 11</span></div><p><strong>Observar y registrar para comprender a nuestro usuario</strong></p><p>4.º '+S.parallel+' · Grupo '+S.group+' · <b>'+esc(c.p.title)+'</b></p><div class="sheet-grid"><article class="sheetcell" style="--edge:#ef75a2;--bg:#fff0f6"><h4>📌 Mi situación</h4><p>'+esc(c.p.situation||c.detail)+'</p></article><article class="sheetcell" style="--edge:#83c87c;--bg:#f1fff0"><h4>👤 Nuestro usuario</h4><p>'+esc(c.p.person||'Personas relacionadas con el proyecto')+'</p></article><article class="sheetcell" style="--edge:#5bc5ec;--bg:#effaff"><h4>👁 ¿Qué observamos?</h4><p>'+esc(c.detail)+'</p></article><article class="sheetcell" style="--edge:#f0be45;--bg:#fff8e5"><h4>📝 ¿Qué registramos?</h4><p>'+esc(c.datum)+'</p></article></div><h3 style="margin-top:20px">🗂 Los cuatro detectives</h3><p class="tiny">Cada integrante escribe o dibuja una evidencia en su propio recuadro. No inventamos resultados: esta ficha es una práctica para decidir qué observar y registrar.</p><div class="sheet-grid">'+roles.map((r,i)=>'<article class="sheetcell" style="--edge:'+r.color+';--bg:'+r.bg+'"><h4>'+r.icon+' '+(i+1)+'. '+r.name+'</h4><p>'+r.q+'</p><label>Integrante: <input data-person="'+i+'" value="'+esc(record.members?.[i]||'')+'" placeholder="Nombre" style="width:100%;border:1px solid #abc9ce;padding:6px"></label><textarea data-note="'+i+'" placeholder="'+['Escribe a quién observarías y por qué.','Dibuja o describe un hecho observable.','Escribe el dato que anotarías.','Indica si usarías dibujo, conteo o tabla.'][i]+'">'+esc(record.notes?.[i]||'')+'</textarea></article>').join('')+'</div><p id="status" class="status" role="status">Guarda tus respuestas en este dispositivo.</p>'+btn('💾 Guardar ficha','save',0)+' '+btn('🖨 Imprimir ficha','print',0)+rubricHTML(false)+'</section>';}
function rubricHTML(ind){const val=record[ind?'individualRubric':'rubric']||{};return '<section class="rubric"><h3>🏅 Rúbrica de evaluación · '+(ind?'Individual':'Grupal')+'</h3><table><thead><tr><th>Criterio</th><th>Puntaje</th></tr></thead><tbody><tr><td>Actividad '+(ind?'individual':'grupal')+'</td><td><select data-score="activity" data-scope="'+(ind?'individualRubric':'rubric')+'"><option value="">— / 7</option>'+Array.from({length:8},(_,i)=>'<option value="'+i+'" '+(val.activity===i?'selected':'')+'>'+i+' / 7</option>').join('')+'</select></td></tr><tr><td>Cumplimiento de códigos · silencio y mesa despejada</td><td><select data-score="codes" data-scope="'+(ind?'individualRubric':'rubric')+'"><option value="">— / 3</option>'+Array.from({length:4},(_,i)=>'<option value="'+i+'" '+(val.codes===i?'selected':'')+'>'+i+' / 3</option>').join('')+'</select></td></tr><tr><th>Total</th><th>'+(Number.isInteger(val.activity)&&Number.isInteger(val.codes)?val.activity+val.codes+' / 10':'Pendiente / 10')+'</th></tr></tbody></table><p class="tiny" style="padding:10px 15px">La docente califica según la evidencia observada. Esta rúbrica no asigna puntos automáticamente.</p></section>';}
function rubricPage(){return '<div class="stage-head"><h2>Evaluación de la actividad grupal</h2><span class="mini">7 + 3 = 10 puntos</span></div><p class="subtitle">Revisa la participación de los cuatro integrantes, la observación, el registro y los códigos del aula.</p>'+rubricHTML(false)+'<p id="status" class="status" role="status">Las calificaciones quedan en este navegador; no se envían a Supabase.</p><div class="actions">'+btn('💾 Guardar evaluación','save',0)+' '+btn('🖨 Imprimir ficha','print',0)+'</div>';}
function updatePrint(){const oldSession=S.session,oldPhase=S.phase;S.session=2;S.phase=2;$('printroot').innerHTML=worksheet();S.session=oldSession;S.phase=oldPhase;const area=$('printroot').querySelectorAll('textarea');area.forEach(t=>{t.textContent=t.value;});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,n=+b.dataset.n;if(act==='order-choose'){const g=gameOrderState(),progress=orderProgress(),step=progress%4;if(progress>=20)return;if(n===step){g.answers.push(n);g.wrong=-1;g.last=progress;record.orderGame=g;save();}else{g.wrong=progress;record.orderGame=g;}render();return;}if(act==='order-jump'){const g=gameOrderState();if(n<=orderProgress()){g.answers=g.answers.slice(0,n);g.wrong=-1;record.orderGame=g;save();render();}return;}if(act==='order-undo'){const g=gameOrderState();g.answers.pop();g.wrong=-1;record.orderGame=g;save();render();return;}if(act==='order-reset'){if(confirm('¿Reiniciar las 20 pistas? Los nombres y notas de los estudiantes se conservan.')){record.orderGame={answers:[]};save();render();}return;}if(act==='phase')S.phase=n;if(act==='step')S.step=n;if(act==='routine')S.routine=n;if(act==='role'){S.role=n;S.selected={};}if(act==='answer'){record.answers??={};record.answers[S.role]=n;save();}if(act==='print'){updatePrint();window.print();return;}if(act==='save')save();render();});
document.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-order-name')||t.hasAttribute('data-order-activity')||t.hasAttribute('data-order-codes')){const n=Number(t.dataset.orderName??t.dataset.orderActivity??t.dataset.orderCodes);if(!Number.isInteger(n)||n<0||n>=20)return;record.orderPupils??={};record.orderPupils[n]??={};const field=t.hasAttribute('data-order-name')?'name':t.hasAttribute('data-order-activity')?'activity':'codes';const value=field==='name'?t.value.trim():t.value===''?null:Number(t.value);if(field!=='name'&&value!==null&&(!Number.isInteger(value)||value<0||value>(field==='activity'?7:3))){alert('Introduce un puntaje entero entre 0 y '+(field==='activity'?7:3));render();return;}record.orderPupils[n][field]=value;save();render();return;}if(t.id==='parallel'){S.parallel=t.value;S.group=1;S.role=0;load();render();}else if(t.id==='group'){S.group=+t.value;S.role=0;load();render();}else if(t.id==='member'||t.hasAttribute('data-person')){record.members??={};record.members[t.id==='member'?S.role:+t.dataset.person]=t.value;save();}else if(t.hasAttribute('data-check')){record.individualPractice??={};record.individualPractice[t.dataset.check]=+t.value;save();}else if(t.hasAttribute('data-score')){record[t.dataset.scope]??={};record[t.dataset.scope][t.dataset.score]=t.value===''?null:+t.value;save();render();}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='board'){const id='ea-w11-ideas-'+S.parallel,v=read(id);v[S.routine]=t.value;try{localStorage.setItem(id,JSON.stringify(v))}catch(e){}}else if(t.hasAttribute('data-note')){record.notes??={};record.notes[t.dataset.note]=t.value;save();}});
$('s1').onclick=()=>{S.session=1;S.phase=0;render()};$('s2').onclick=()=>{S.session=2;S.phase=0;render()};$('prev').onclick=()=>{S.phase=Math.max(0,S.phase-1);render();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{S.phase=Math.min(3,S.phase+1);render();window.scrollTo({top:0,behavior:'smooth'})};$('fullscreen').onclick=()=>{document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()};$('parallel').value=S.parallel;load();render();
})();
</script></body></html>
